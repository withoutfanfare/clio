[package]
name = "clio-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "CLI for Clio shared memory system"

[features]
default = ["local-embeddings"]
local-embeddings = ["clio-core/local-embeddings"]
local-embeddings-dynamic = ["clio-core/local-embeddings-dynamic"]

[[bin]]
name = "clio"
path = "src/main.rs"

[dependencies]
clio-core = { workspace = true, default-features = false, features = ["openai-embeddings", "capture"] }
clap = { version = "4", features = ["derive"] }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
